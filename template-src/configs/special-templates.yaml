# yamllint disable rule:line-length
---
template_families:
  frosted_glass:
    label: "Frosted Glass"
    base: websocket-base
    description: "Frosted glass overlay with blurred background"
    common_css:
      - obs-compatibility
      - frosted-glass
    common_websocket:
      - metadata-streaming

    templates:
      ws-frosted-glass:
        effect_label: "None"
        title: "Frosted Glass"
        description: "Frosted glass effect titlecard"
        body_layout: frosted-glass-layout
        display_js: frosted-glass-display
        effects: []
        timing_defaults:
          hide_after: 0
          repeat_animation: 0
          delay_update: 0

  gifwords:
    label: "GIFWords"
    base: websocket-base
    description: "Animated GIF background with lyrics/words display"
    common_css:
      - obs-compatibility
      - gifwords-display
    common_websocket:
      - gifwords-streamer

    templates:
      ws-gifwords-fade:
        effect_label: "Fade"
        title: "GIFWords"
        description: "GIF background with fading text overlay"
        body_layout: gifwords-layout
        display_js: gifwords-display
        effects:
          - gifwords-fade-effects
        timing_defaults:
          hide_after: 0
          repeat_animation: 0
          delay_update: 0

  typing_effects:
    label: "Typing"
    base: websocket-base
    description: "Typewriter-style animated text display"
    external_js:
      - "vendor/typed.min.js"
    common_css:
      - obs-compatibility
      - typing_effects
    common_websocket:
      - metadata-streaming

    templates:
      ws-typing-classic:
        effect_label: "Classic"
        title: "Typing Classic"
        description: "Classic typewriter effect on paper"
        body_layout: typing_layout
        display_js: typed_effects
        body_class: typewriter-style
        effects: []
        timing_defaults:
          hide_after: 0
          repeat_animation: 0
          delay_update: 0

      ws-typing-amber:
        effect_label: "Amber"
        title: "Typing Amber"
        description: "Amber terminal typing effect"
        body_layout: typing_layout
        display_js: typed_effects
        body_class: amber-style
        effects: []
        timing_defaults:
          hide_after: 0
          repeat_animation: 0
          delay_update: 0

      ws-typing-terminal:
        effect_label: "Terminal"
        title: "Typing Terminal"
        description: "Terminal-style typing effect with mistakes"
        body_layout: typing_layout
        display_js: typed_effects
        body_class: terminal-style
        effects: []
        timing_defaults:
          hide_after: 0
          repeat_animation: 0
          delay_update: 0

  matrix_rain:
    label: "Typing"
    base: websocket-base
    description: "Matrix digital rain with scrolling text"
    common_css:
      - obs-compatibility
      - matrix-rain
    common_websocket:
      - metadata-streaming

    templates:
      ws-typing-matrix:
        effect_label: "Matrix"
        title: "Typing Matrix"
        description: "Matrix digital rain effect"
        body_layout: matrix-rain-layout
        display_js: matrix-rain
        effects: []
        timing_defaults:
          hide_after: 0
          repeat_animation: 0
          delay_update: 0

  requests:
    label: "Requests"
    base: websocket-base
    description: "Track request display overlay"
    common_css:
      - obs-compatibility
    common_websocket:
      - metadata-streaming

    templates:
      ws-requests:
        effect_label: "None"
        title: "Requests"
        description: "Track request display"
        body_layout: basic-text-layout
        display_js: basic-text-display
        effects: []
        timing_defaults:
          hide_after: 0
          repeat_animation: 0
          delay_update: 0
