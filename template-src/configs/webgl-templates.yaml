    common_js:
      - webgl-helpers
    common_websocket:
      - metadata-streaming

    templates:
      ws-webgl-spectrum:
        effect_label: "Spectrum"
        title: "WebGL Spectrum"
        description: "Animated EQ bars with artist and title overlay"
        body_layout: webgl-spectrum-layout
        display_js: webgl-spectrum
        timing_defaults:
          hide_after: 0
          repeat_animation: 0
          delay_update: 0

  webgl_hologram:
    label: "WebGL"
    base: webgl-base
