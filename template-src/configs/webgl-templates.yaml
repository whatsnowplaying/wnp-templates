---
template_families:
  webgl_vinyl:
    label: "WebGL"
    base: webgl-base
    description: "WebGL-rendered spinning vinyl record with cover art texture"
    common_css:
      - obs-compatibility
      - vendor-fonts
      - webgl-vinyl
    common_js:
      - webgl-helpers
    common_websocket:
      - metadata-streaming

    templates:
      ws-webgl-vinyl:
        effect_label: "Vinyl"
        title: "WebGL Vinyl"
        description: "Spinning vinyl record with cover art and track info"
        body_layout: webgl-vinyl-layout
        display_js: webgl-vinyl
        image_field: coverimagebase64
        timing_defaults:
          hide_after: 0
          repeat_animation: 0
          delay_update: 0

  webgl_spectrum:
    label: "WebGL"
    base: webgl-base
    description: "WebGL animated EQ spectrum bars lower-third"
    common_css:
      - obs-compatibility
      - vendor-fonts
