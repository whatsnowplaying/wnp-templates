    templates:
      ws-webgl-hologram:
        effect_label: "Hologram"
        title: "WebGL Hologram"
        description: "Cyberpunk scanline panel with glitch text reveal on track
          change"
        body_layout: webgl-hologram-layout
        display_js: webgl-hologram
        timing_defaults:
          hide_after: 0
          repeat_animation: 0
          delay_update: 0

  webgl_wave:
    label: "WebGL"
    base: webgl-base
