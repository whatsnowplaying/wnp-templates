[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wnp-templates"
dynamic = ["version"]
description = "Shared display templates and utilities for What's Now Playing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
build = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "truststore>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wnp_templates" = ["bundled/*.htm", "preview/*.png", "vendor.yaml"]

[tool.setuptools_scm]
write_to = "src/wnp_templates/_version.py"

[tool.pylint.messages_control]
max-line-length = 100

[tool.pyright]
pythonVersion = "3.10"
